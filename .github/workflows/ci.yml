name: CI
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  flutter-checks:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze
      - run: flutter test

  build-android:
    needs: flutter-checks
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - name: Generate platform folders (only adds missing files)
        run: flutter create . --org com.orvella --project-name orvella --platforms=android
      - run: rm -f test/widget_test.dart
        shell: bash
      - name: Add INTERNET permission to main manifest
        shell: bash
        run: |
          f=android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.INTERNET' "$f" || sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' "$f"
      - run: flutter pub get
      - run: flutter build apk --debug --dart-define=ORVELLA_SERVER=${{ vars.ORVELLA_SERVER }}
      - uses: actions/upload-artifact@v4
        with:
          name: orvella-android-debug-apk
          path: app/build/app/outputs/flutter-apk/app-debug.apk

  build-windows:
    needs: flutter-checks
    runs-on: windows-latest
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - name: Generate platform folders (only adds missing files)
        run: flutter create . --org com.orvella --project-name orvella --platforms=windows
      - run: rm -f test/widget_test.dart
        shell: bash
      - run: flutter pub get
      - run: flutter build windows --release --dart-define=ORVELLA_SERVER=${{ vars.ORVELLA_SERVER }}
      - uses: actions/upload-artifact@v4
        with:
          name: orvella-windows-release
          path: app/build/windows/x64/runner/Release/

  build-ios:
    needs: flutter-checks
    runs-on: macos-latest
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - name: Generate platform folders (only adds missing files)
        run: flutter create . --org com.orvella --project-name orvella --platforms=ios
      - run: rm -f test/widget_test.dart
      - run: flutter pub get
      - run: flutter build ios --no-codesign --release --dart-define=ORVELLA_SERVER=${{ vars.ORVELLA_SERVER }}
      - run: cd build/ios/iphoneos && zip -r "$GITHUB_WORKSPACE/app/Runner-unsigned.zip" Runner.app
      - uses: actions/upload-artifact@v4
        with:
          name: orvella-ios-unsigned
          path: app/Runner-unsigned.zip

  server:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: server } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm test

  server-docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t orvella-server .
